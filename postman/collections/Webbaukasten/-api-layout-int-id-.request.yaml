$kind: http-request
name: /api/layout/<int:id>
description: |-
  ## Layout per ID laden

  **GET** `127.0.0.1:5000/api/layout/<id>`

  Lädt ein einzelnes gespeichertes Layout anhand seiner ID aus der Datenbank.

  ---

  ### Parameter

  | Parameter | Typ | Beschreibung |
  |---|---|---|
  | **id** | integer | Eindeutige ID des Layouts (Pfadparameter, z. B. `/api/layout/2`) |

  ---

  ### Request-Body

  Keiner erforderlich.

  ---

  ### Antwort (HTTP 200)

  Gibt ein JSON-Objekt mit folgenden Feldern zurück:

  | Feld | Typ | Beschreibung |
  |---|---|---|
  | **moduleName** | string | Name des Moduls (z. B. `"Postman-Integrationstest"`) |
  | **version** | string | Versionsnummer des Layouts (z. B. `"1.0"`) |
  | **content** | object | Layout-Inhalt als verschachteltes Komponentenobjekt |

  #### Struktur von `content`

  | Feld | Typ | Beschreibung |
  |---|---|---|
  | **id** | string | Eindeutige ID des Wurzelelements (z. B. `"root"`) |
  | **type** | string | Typ des Elements (z. B. `"canvas"`) |
  | **props** | object | Eigenschaften des Elements (z. B. `gridCols`, `gridRows`) |
  | **children** | array | Liste von Kindelementen, jeweils mit `id`, `type` und `props` |

  ---

  ### Fehlercodes

  | HTTP-Status | Bedeutung |
  |---|---|
  | **404** | Kein Layout mit der angegebenen ID gefunden |
  | **500** | Interner Serverfehler |

  ---
url: 127.0.0.1:5000/api/layout/2
method: GET
body:
  type: text
  content: ""
order: 2000
